<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>공유 링크 만들기</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;line-height:1.5}
  label{display:block;margin-top:14px;font-weight:600}
  input{width:100%;box-sizing:border-box;padding:9px;font-size:15px;margin-top:4px}
  button{margin-top:18px;padding:10px 16px;font-size:15px}
  textarea{width:100%;box-sizing:border-box;height:110px;margin-top:8px;font-size:13px}
  .note{color:#666;font-size:13px}
</style>
</head>
<body>
<h1>공유 링크 만들기</h1>
<p class="note">토큰을 암호로 암호화해 링크에 붙입니다. 입력한 값은 이 화면 안에서만 쓰이고 어디로도 전송되지 않습니다.
링크와 암호는 <b>서로 다른 경로</b>로 전달하세요.</p>

<label for="n">캐릭터 닉네임 (선택)</label>
<input id="n" autocomplete="off" />
<label for="t">GitHub 토큰</label>
<input id="t" type="password" autocomplete="off" placeholder="github_pat_..." />
<label for="p">암호 (받는 사람이 처음 한 번 입력)</label>
<input id="p" type="password" autocomplete="off" />
<button id="go">링크 만들기</button>

<div id="out" hidden>
  <textarea id="url" readonly></textarea>
  <button id="copy">복사</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const b64u = (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function encrypt(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  const all = new Uint8Array(16 + 12 + data.length);
  all.set(salt, 0); all.set(iv, 16); all.set(data, 28);
  return b64u(all);
}

$("go").onclick = async () => {
  const t = $("t").value.trim(), p = $("p").value, n = $("n").value.trim();
  if (!t || !p) return alert("토큰과 암호를 입력해주세요.");
  const blob = await encrypt({ t, n }, p);
  const base = location.href.replace(/link\.html.*$/, "index.html");
  $("url").value = base + "#e=" + blob;
  $("out").hidden = false;
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("url").value); $("copy").textContent = "복사됨"; }
  catch { $("url").select(); }
};
</script>
</body>
</html>
