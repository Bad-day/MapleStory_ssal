<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>공유 링크 만들기</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;line-height:1.5}
  label{display:block;margin-top:14px;font-weight:600}
  input{width:100%;box-sizing:border-box;padding:9px;font-size:15px;margin-top:4px}
  button{margin-top:18px;padding:10px 16px;font-size:15px}
  textarea{width:100%;box-sizing:border-box;height:110px;margin-top:8px;font-size:13px}
  .note{color:#666;font-size:13px}
</style>
</head>
<body>
<h1>공유 링크 만들기</h1>
<p class="note">닉네임과 토큰을 최대한 짧게 압축·암호화해 링크 하나로 만듭니다. 입력한 값은 이 화면 안에서만 쓰이고 어디로도 전송되지 않습니다.
링크를 가진 사람은 토큰을 쓸 수 있으니 <b>믿는 사람에게만</b> 전달하세요.</p>

<label for="n">캐릭터 닉네임 (선택)</label>
<input id="n" autocomplete="off" />
<label for="t">GitHub 토큰</label>
<input id="t" type="password" autocomplete="off" placeholder="github_pat_..." />
<button id="go">링크 만들기</button>

<div id="out" hidden>
  <textarea id="url" readonly></textarea>
  <button id="copy">복사</button>
</div>

<script src="./sync.js"></script>
<script>
const $ = (id) => document.getElementById(id);

$("go").onclick = async () => {
  const t = $("t").value.trim(), n = $("n").value.trim();
  if (!t) return alert("토큰을 입력해주세요.");
  const blob = await SsalSync.encodeLink({ t, n });
  const base = location.href.replace(/link\.html.*$/, "");
  $("url").value = base + "#k=" + blob;
  $("out").hidden = false;
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("url").value); $("copy").textContent = "복사됨"; }
  catch { $("url").select(); }
};
</script>
</body>
</html>
